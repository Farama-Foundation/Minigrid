name: Tests
on:
  push:
    paths:
      - '.github/workflows/tests.yml'
      - 'minigrid/**'
      - 'tests/**'
      - 'setup.py'
      - 'pyproject.toml'
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/tests.yml'
      - 'minigrid/**'
      - 'tests/**'
      - 'setup.py'
      - 'pyproject.toml'
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm, macos-latest, windows-latest, windows-11-arm]
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install .[wfc,testing]
      - name: Run tests
        run: pytest tests -v -s --timeout=300 --timeout-method=thread
        timeout-minutes: 15
